name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Confirm published seed is explicit
        run: |
          test -f dist/published-seed.json
          test -f dist/published-seed.manifest.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('dist/published-seed.manifest.json','utf8')); if(m.source!=='data/research.json') process.exit(1); if(!m.contentNote) process.exit(1);"
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - run: npm run test:smoke
