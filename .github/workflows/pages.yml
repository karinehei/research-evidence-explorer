# Deploys the static research explorer to GitHub Pages.
# Manual only — ordinary push/PR checks must not publish unpublished notes.
name: Deploy GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Confirm published seed is curated only
        run: |
          test -f dist/published-seed.json
          node -e "const fs=require('fs'); const seed=JSON.parse(fs.readFileSync('dist/published-seed.json','utf8')); if(seed.schemaVersion!==2) process.exit(1); if(Array.isArray(seed.editLog)&&seed.editLog.length) { console.error('Published seed must not carry a private editLog'); process.exit(1);} "
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
